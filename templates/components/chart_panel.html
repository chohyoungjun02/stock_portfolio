<!-- 일봉 + RSI + MACD 차트 카드 -->
<div class="card chart-card">
  <div class="chart-header">
    <div class="section-title">
      <span id="currentChartTicker">QLD</span> <span style="font-size: 0.9rem; font-weight: 500; color: var(--subtext);">일봉 · 최근 3개월</span>
    </div>
    <div class="chart-search-box">
      <input type="text" id="tickerInput" placeholder="티커 입력 (예: QLD, SOXS, NVDA)" aria-label="티커 입력" />
      <button class="btn-refresh" id="chartSearchBtn">차트 보기</button>
    </div>
  </div>

  <!-- 지표 범례 (색상은 static/js/chart.js의 시리즈 색과 동일) -->
  <div class="chart-legend">
    <span><i style="background:#f59e0b;"></i>MA20</span>
    <span><i style="background:#00c471;"></i>MA60</span>
    <span><i style="background:#8b5cf6;"></i>MA120</span>
    <span><i style="background:#b0b8c1;"></i>볼린저 밴드</span>
    <span style="color:#00a661;">▲ 진입 신호</span>
    <span style="color:#ff8a00;">▼ 주의 신호</span>
    <span style="color: var(--subtext);">· 드래그하면 이전 기간을 볼 수 있어요</span>
  </div>

  <!-- 상단 일봉 차트 (높이 400px) -->
  <div id="chartContainer" style="height: 400px; width: 100%; overflow: hidden; position: relative;"></div>

  <!-- RSI 지표 구분 바 -->
  <div class="rsi-title-bar">
    <span>RSI (14)</span>
    <span style="font-size: 0.78rem; font-weight: 500; color: var(--subtext);">상단: 과매수(70) / 하단: 과매도(30)</span>
  </div>

  <!-- RSI 차트 -->
  <div id="rsiContainer" style="height: 130px; width: 100%; overflow: hidden; position: relative;"></div>

  <!-- MACD 지표 구분 바 -->
  <div class="rsi-title-bar">
    <span>MACD (12, 26, 9)</span>
    <span style="font-size: 0.78rem; font-weight: 500; color: var(--subtext);">파랑: MACD / 주황: 시그널 / 막대: 히스토그램</span>
  </div>

  <!-- MACD 차트 -->
  <div id="macdContainer" style="height: 130px; width: 100%; overflow: hidden; position: relative;"></div>
</div>
