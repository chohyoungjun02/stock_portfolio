<!-- 모의투자: 가상 현금으로 사고팔기 (static/js/paper.js, 브라우저에 저장) -->
<div class="paper-grid">
  <div class="card">
    <div class="holdings-header">
      <div class="section-title">내 모의 계좌</div>
      <div class="paper-actions">
        <button class="btn-refresh secondary" type="button" id="paperRefresh">시세 새로고침</button>
        <button class="btn-refresh secondary" type="button" id="paperReset">초기화</button>
      </div>
    </div>
    <div class="paper-total">
      <small>총자산</small>
      <b id="paperTotal">-</b>
      <span id="paperProfit">-</span>
    </div>
    <dl class="cmp-rows paper-sums">
      <div><dt>주문 가능 현금</dt><dd id="paperCash">-</dd></div>
      <div><dt>주식 평가 금액</dt><dd id="paperStock">-</dd></div>
      <div><dt>시작 금액</dt><dd>30,000,000원</dd></div>
    </dl>
  </div>

  <div class="card">
    <div class="section-title" style="margin-bottom: 14px;">주문하기</div>
    <form id="paperOrder" class="paper-order">
      <label>종목<input id="paperSymbol" required maxlength="30" placeholder="예: 엔비디아, 삼성전자" autocomplete="off"></label>
      <label>수량 (주)<input id="paperQty" type="number" required min="1" step="1" value="1"></label>
      <div class="paper-price" id="paperPrice" aria-live="polite">종목을 입력하면 현재가를 보여드려요.</div>
      <div class="paper-buttons">
        <button class="btn-refresh paper-buy" type="submit" value="buy">사기</button>
        <button class="btn-refresh paper-sell" type="submit" value="sell">팔기</button>
      </div>
      <div class="paper-msg" id="paperMsg" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<div class="card market-card">
  <div class="section-title" style="margin-bottom: 12px;">보유 종목 <span style="font-size: 0.85rem; font-weight: 500; color: var(--subtext);">종목을 누르면 주문창에 채워져요</span></div>
  <div class="table-wrap">
    <table class="paper-table">
      <thead>
        <tr><th>종목</th><th>수량</th><th>평균 단가</th><th>현재가</th><th>평가 금액</th><th>손익 (수익률)</th></tr>
      </thead>
      <tbody id="paperHoldings"></tbody>
    </table>
  </div>
</div>

<div class="card market-card">
  <div class="section-title" style="margin-bottom: 12px;">거래 내역</div>
  <div id="paperTrades"></div>
  <div class="disclaimer">※ 가상 현금으로 하는 연습용 거래예요. 실제 돈·주식과 관계없고, 이 브라우저에만 저장돼요. 시세는 지연될 수 있고, 해외 종목은 거래 시점 환율로 원화 환산해요. 수수료·세금은 계산하지 않아요.</div>
</div>
