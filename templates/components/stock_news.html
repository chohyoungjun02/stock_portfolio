<!-- 주요 단일 종목 뉴스 + 종목 뉴스 검색 -->
<div class="card market-card">
  <div class="holdings-header">
    <div class="section-title" id="newsTitle">종목별 주요 뉴스</div>
    <form class="chart-search-box" id="newsSearchForm">
      <input type="text" id="newsQuery" maxlength="30" placeholder="종목 검색 (예: 현대차, 팔란티어)" aria-label="뉴스를 찾을 종목">
      <button class="btn-refresh" type="submit">검색</button>
      <button class="btn-refresh secondary" type="button" id="newsReset" hidden>주요 종목 보기</button>
    </form>
  </div>
  <div class="watchlist" id="newsWatchlist"></div>
  <div id="stockNews" class="news-grid">
    <span style="color: var(--subtext);">뉴스를 불러오는 중입니다...</span>
  </div>
  <div class="disclaimer">※ 네이버 뉴스 검색 결과예요.</div>
</div>
