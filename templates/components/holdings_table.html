<!-- 보유 자산 테이블 카드 -->
<div class="card">
  <div class="holdings-header">
    <div class="section-title">보유 주식 <span style="font-size: 0.85rem; font-weight: 500; color: var(--subtext);">종목을 누르면 차트가 바뀌어요</span></div>
    <div class="holdings-actions">
      <span id="fxRateText" style="font-size: 0.85rem; color: var(--subtext);"></span>
      <button class="btn-refresh secondary" id="currencyToggle">원화로 보기 (₩)</button>
      <button class="btn-refresh secondary" id="refreshHoldings">새로고침</button>
    </div>
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>종목</th>
          <th>보유수량</th>
          <th>매입단가</th>
          <th>현재가</th>
          <th>평가금액</th>
          <th>평가손익 (수익률)</th>
        </tr>
      </thead>
      <tbody id="holdingBody">
        <tr>
          <td colspan="6" style="text-align: center; color: var(--subtext); padding: 24px;">데이터를 불러오는 중입니다...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
