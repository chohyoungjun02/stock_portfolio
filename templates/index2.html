<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 대시보드</title>
  <!-- Lightweight Charts v4.1.1 CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chart.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/analysis.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/market.css') }}">
</head>
<body>
  <div class="container">
    {% include 'components/header.html' %}

    <!-- 탭 1: 차트(왼쪽) + 기술적 분석 요약(오른쪽) 2단 레이아웃 -->
    <section id="chartTab" role="tabpanel">
      <div class="chart-layout">
        {% include 'components/chart_panel.html' %}

        {% include 'components/analysis_panel.html' %}
      </div>
    </section>

    <!-- 탭 2: 오늘의 시장 키워드 + 종목별 뉴스 -->
    <section id="newsTab" role="tabpanel" hidden>
      {% include 'components/market_keywords.html' %}

      {% include 'components/stock_news.html' %}
    </section>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
